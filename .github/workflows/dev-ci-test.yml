name: CI on VM with Docker Execution

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: self-hosted
    container:
      image: registry.dev.nudgebee.pollux.in/profiler-vm:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create tag name
        run: echo "tag=$(date +'%Y-%m-%dT%H-%M-%S')_${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login \
            --username AWS --password-stdin 864186153326.dkr.ecr.us-east-1.amazonaws.com

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and Push Images in Parallel
        run: |
          set -e
          TAG=${{ env.tag }}
          REPO=864186153326.dkr.ecr.us-east-1.amazonaws.com/nudgebee-profiler

          parallel --jobs 4 ::: \
            "docker buildx build -t $REPO-jvm:$TAG -f docker/jvm/alpine/Dockerfile --push ." \
            "docker buildx build -t $REPO-bpf:$TAG -f docker/bpf/Dockerfile --push ." \
            "docker buildx build -t $REPO-python:$TAG -f docker/python/Dockerfile --push ." \
            "docker buildx build -t $REPO-perf:$TAG -f docker/perf/Dockerfile --push ."
